<div class="mt-5 ml-3 ">
  <div class="flex items-center justify-center">
    <div
      class="mx-2 w-200 flex items-center rounded-md bg-white pl-3 outline-1 -outline-offset-1 outline-gray-300 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-600">
      <input type="text" name="username" id="username" [(ngModel)]="searchName" (keydown.enter)="searchProducts()"
        class="block min-w-0 grow py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6"
        placeholder="Search by name">
    </div>
    <button type="button" (click)="searchProducts()"
      class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Search</button>
  </div>
</div>

<div class="bg-white">
  <div class="mx-auto max-w-1xl px-4 py-2 sm:px-6 sm:py-24 lg:max-w-8xl lg:px-4">
    <h2 class="sr-only">Products</h2>

    <a class="grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 xl:gap-x-8"
      [routerLink]="['/product']">
      @for (item of products$ | async; track $index) {
      <a class="group cursor-pointer">
        <img [src]="item.imageUrl" alt="Tall slender porcelain bottle with natural clay textured body and cork stopper."
          class="aspect-square w-108 rounded-lg bg-gray-200 object-cover group-hover:opacity-75 xl:aspect-7/8">
        <h3 class="mt-4 text-sm text-gray-700"> {{ item.title }}</h3>
        <p class="mt-1 text-lg font-medium text-gray-900"> {{ item.price | currency }}</p>
      </a>
      }
    </a>
  </div>
</div>
